roi:
  score: 35
  nivel: baixo
  justificativa: Projeto open data sob licença CC0 sem modelo de receita direta. O
    retorno é reputacional e cívico, funcionando como funil de credibilidade para
    o ecossistema de dossiês (GoSurf, lawfare-timeline). Monetização indireta possível
    mas não estruturada.
  fatores_positivos:
  - Corpus único e auditável sobre captura institucional do Judiciário brasileiro,
    com classificação evidencial R1–R7
  - Integração sólida com ecossistema de 12+ hubs temáticos, ampliando alcance e citação
    cruzada
  - Stack leve (HTML estático + JSON + Vercel) com custo operacional próximo de zero
  fatores_negativos:
  - Sem modelo de receita — licença CC0 impede paywall e dificulta monetização direta
  - Público-alvo nicho (advocacy, jornalismo investigativo, pesquisa jurídica) com
    baixa disposição para pagar
conversao:
  score: 15
